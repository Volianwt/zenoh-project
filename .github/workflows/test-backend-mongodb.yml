name: MongoDB Backend Tests (Manual Mongo)

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Start MongoDB manually
        run: |
          docker run -d -p 27017:27017 --name mongo mongo:6.0
          echo "Waiting for MongoDB to be ready..."
          for i in {1..15}; do
            if docker exec mongo mongosh --eval 'db.runCommand({ ping: 1 })' | grep '"ok" : 1'; then
              echo "MongoDB is ready!"
              break
            fi
            echo "Retrying ($i)..."
            sleep 4
          done

      - name: Run tests
        env:
          MONGO_URI: "mongodb://127.0.0.1:27017"
        run: cargo test -p zenoh-backend-mongodb -- --nocapture
