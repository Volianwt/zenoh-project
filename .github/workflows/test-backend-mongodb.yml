name: Test Zenoh MongoDB Backend

on:
  push:
    branches: [main, "test"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run MongoDB Backend Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v3

      - name: Wait for MongoDB
        run: |
          for i in {1..10}; do
            mongo --eval 'db.runCommand({ ping: 1 })' && break
            echo "Waiting for MongoDB..."
            sleep 5
          done


      # Install Rust
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # Cache Cargo registry and target
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build workspace
      - name: Build Workspace
        run: cargo build --workspace --verbose

      # Run MongoDB backend tests (using the Docker service)
      - name: Run MongoDB Integration Tests
        run: |
          export MONGO_URI="mongodb://localhost:27017"
          cargo test -p zenoh-backend-mongodb -- --nocapture
